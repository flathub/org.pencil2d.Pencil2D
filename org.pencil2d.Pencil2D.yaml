app-id: org.pencil2d.Pencil2D
default-branch: stable
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: pencil2d
finish-args:
  - --socket=wayland
  - --share=network # to make the update checker work
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=host # to make saving work
cleanup:
  - /include
  - /lib/pkgconfig
modules:
  - name: pencil2d
    buildsystem: qmake
    builddir: true
    config-opts:
      - CONFIG-=debug_and_release
      - CONFIG+=GIT
      - VERSION=0.7.2
    cleanup:
      - /share/bash-completion
      - /share/zsh
    sources:
      - type: git
        url: https://github.com/pencil2d/pencil.git
        commit: 022529ab1a83eb278ae6c7bc3ce501307db8756f
        tag: v0.7.2
